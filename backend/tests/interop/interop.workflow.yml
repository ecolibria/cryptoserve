# Proposed CI job: to enable it, copy this file to .github/workflows/interop.yml.
#
# Cross-implementation ML-KEM-768 check: the server's liboqs, built at the
# version backend/Dockerfile ships, against the Go standard library's
# crypto/mlkem. CRYPTOSERVE_INTEROP_REQUIRED=1 makes the absence of either
# implementation fail the job instead of skipping the tests.
name: Interop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlkem768:
    name: ML-KEM-768 liboqs vs Go crypto/mlkem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: backend/tests/interop/mlkem_go_helper/go.mod
          cache: false

      - name: Build liboqs 0.15.0 (the version backend/Dockerfile builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          git clone --depth 1 --branch 0.15.0 https://github.com/open-quantum-safe/liboqs.git "$RUNNER_TEMP/liboqs"
          cmake -S "$RUNNER_TEMP/liboqs" -B "$RUNNER_TEMP/liboqs/build" -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON
          ninja -C "$RUNNER_TEMP/liboqs/build"
          sudo ninja -C "$RUNNER_TEMP/liboqs/build" install
          sudo ldconfig

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt -r requirements-pqc.txt

      - name: Build the Go crypto/mlkem helper
        run: |
          cd backend/tests/interop/mlkem_go_helper
          go version
          go build -o "$RUNNER_TEMP/mlkem-go-helper" .

      - name: Run the interop check
        env:
          STARTUP_VALIDATION_LEVEL: skip
          DEV_MODE: "true"
          OQS_INSTALL_PATH: /usr/local
          CRYPTOSERVE_INTEROP_REQUIRED: "1"
          CRYPTOSERVE_INTEROP_GO_HELPER: ${{ runner.temp }}/mlkem-go-helper
        run: |
          cd backend
          python -c "import oqs; print('liboqs', oqs.oqs_version())"
          pytest tests/interop -v -rs
